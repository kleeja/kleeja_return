<header class="k-reveal k-reveal-1 mb-6">
    <span class="k-eyebrow mb-3"><i class="icon-download"></i>{lang.FILE_INFO}</span>
    <h1 class="k-title k-break">{title}</h1>
</header>

<div class="grid gap-5 lg:grid-cols-5">

    <!-- ---------------------------- file facts ---------------------------- -->
    <section class="k-reveal k-reveal-2 k-card overflow-hidden lg:col-span-3">
        <dl class="m-0">
            <div class="k-listrow">
                <dt><i class="icon-file-text"></i>{lang.FILENAME}</dt>
                <dd class="k-break max-w-[60%]">{name}</dd>
            </div>
            <div class="k-listrow">
                <dt><i class="icon-paperclip"></i>{lang.FILETYPE}</dt>
                <dd class="k-break">{type}</dd>
            </div>
            <div class="k-listrow">
                <dt><i class="icon-hard-drive"></i>{lang.FILESIZE}</dt>
                <dd>{size}</dd>
            </div>
            <div class="k-listrow">
                <dt><i class="icon-calendar"></i>{lang.FILEDATE}</dt>
                <dd>{time}</dd>
            </div>
            <div class="k-listrow">
                <dt><i class="icon-download"></i>{lang.FILEUPS}</dt>
                <dd>{uploads}</dd>
            </div>

            <IF NAME="fusername">
                <div class="k-listrow">
                    <dt><i class="icon-user"></i>{lang.USERNAME}</dt>
                    <dd><a href="{userfolder}" class="k-link">{fusername}</a></dd>
                </div>
            </IF>
        </dl>

        <div class="border-t px-4 py-3 text-center" style="border-color: var(--k-line);">
            <a href="{REPORT}" rel="nofollow" class="inline-flex items-center gap-1.5 text-xs text-faint no-underline transition-colors hover:text-danger">
                <i class="icon-flag"></i>
                {lang.FILEREPORT}
            </a>
        </div>
    </section>

    <!-- ---------------------------- download box --------------------------- -->
    <section class="k-reveal k-reveal-3 k-card k-spot flex flex-col items-center justify-center p-8 text-center lg:col-span-2"
             data-spotlight data-countdown="{seconds_w}">

        <p class="k-chip k-chip-brand mb-6"><i class="icon-circle-check"></i>{lang.FILE_FOUNDED}</p>

        <!-- counting down -->
        <div data-countdown-wait>
            <div class="k-ring" data-countdown-ring>
                <span class="k-ring-value" data-countdown-value>{seconds_w}</span>
            </div>
            <p class="mt-4 text-sm font-semibold text-muted">{lang.WAIT}</p>
        </div>

        <!-- ready -->
        <div data-countdown-ready hidden>
            <span class="k-drop-icon mx-auto"><i class="icon-download"></i></span>
            <a href="{url_file}" target="_blank" class="k-btn k-btn-primary k-btn-lg mt-5">
                <i class="icon-download"></i>
                {lang.CLICK_DOWN}
            </a>
            <p class="mt-3"><span class="k-chip">{size}</span></p>
        </div>

        <noscript>
            <div class="k-alert k-alert-warn mt-4 text-start">{lang.JS_MUST_ON}</div>
        </noscript>
    </section>
</div>
