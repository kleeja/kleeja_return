<header class="k-reveal k-reveal-1 mb-6">
    <span class="k-eyebrow mb-3"><i class="icon-folder"></i>{lang.YOUR_FILEUSER}</span>

    <IF NAME="user_himself">
        <h1 class="k-title">{lang.YOUR_FILEUSER}</h1>
    <ELSE>
        <h1 class="k-title">{title}</h1>
    </IF>

    <IF NAME="user_name">
        <p class="k-subtitle">
            {lang.PUBLIC_USER_FILES}: <strong class="text-fg-soft">{user_name}</strong>
            <span class="k-chip k-chip-brand ms-2">{lang.ALL_FILES}: {nums_rows}</span>
        </p>
    </IF>
</header>

<IF NAME="no_results">

    <div class="k-card mx-auto max-w-lg p-10 text-center">
        <span class="k-auth-icon"><i class="icon-folder"></i></span>
        <p class="mt-4 text-sm text-muted">{lang.NO_FILE_USER}</p>
    </div>

<ELSE>

    <IF NAME="user_himself">
        <form name="c" action="{action}" method="post" data-confirm="{lang.ARE_YOU_SURE_DO_THIS}">
    </IF>

    <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5">

        <LOOP NAME="arr">

            <IF LOOP="is_image">

                <!-- image -->
                <article class="k-file-card" data-reveal>
                    <a href="{{href}}" target="_blank" class="k-file-thumb">
                        <i class="icon-image k-file-thumb-fallback" aria-hidden="true"></i>
                        <img src="{{thumb_link}}" alt="{{name_file}}" loading="lazy"
                             onerror="this.onerror=null;this.style.display='none';">
                        <span class="k-file-overlay">
                            <i class="icon-external-link"></i>
                        </span>
                    </a>

                    <div class="k-file-meta">
                        <span class="k-file-name" title="{{name_file}}">{{name_file}}</span>
                        <span class="k-file-sub">
                            <span title="{lang.FILESIZE}"><i class="icon-hard-drive"></i>{{size}}</span>
                            <span title="{lang.FILEUPS}"><i class="icon-download"></i>{{uploads}}</span>
                        </span>
                        <span class="k-file-date"><i class="icon-clock"></i>{{time}}</span>
                    </div>

                    <IF NAME="user_himself">
                        <label class="k-file-pick" title="{lang.DEL_SELECTED}">
                            <input id="del_{{id}}" name="del_{{id}}" type="checkbox" value="{{id}}" rel="_del" class="k-check">
                        </label>
                    </IF>
                </article>

            <ELSE>

                <!-- other file -->
                <article class="k-file-card" data-reveal>
                    <a href="{{href}}" target="_blank" class="k-file-thumb k-file-thumb-doc">
                        <i class="icon-file-text k-file-thumb-fallback" aria-hidden="true"></i>
                        <img src="{{thumb_link}}" alt="" loading="lazy" class="k-file-thumb-glyph"
                             onerror="this.onerror=null;this.style.display='none';">
                        <span class="k-file-overlay">
                            <i class="icon-external-link"></i>
                        </span>
                    </a>

                    <div class="k-file-meta">
                        <span class="k-file-name" title="{{name_file}}">{{name_file}}</span>
                        <span class="k-file-sub">
                            <span title="{lang.FILESIZE}"><i class="icon-hard-drive"></i>{{size}}</span>
                            <span title="{lang.FILEUPS}"><i class="icon-download"></i>{{uploads}}</span>
                        </span>
                        <span class="k-file-date"><i class="icon-clock"></i>{{time}}</span>
                    </div>

                    <IF NAME="user_himself">
                        <label class="k-file-pick" title="{lang.DEL_SELECTED}">
                            <input id="del_{{id}}" name="del_{{id}}" type="checkbox" value="{{id}}" rel="_del" class="k-check">
                        </label>
                    </IF>
                </article>

            </IF>
        </LOOP>
    </div>

    <!-- pagination -->
    {page_nums}

    <IF NAME="user_himself">

        <div class="k-card mt-6 flex flex-wrap items-center justify-between gap-3 p-4">
            <button type="button" class="k-btn k-btn-ghost" data-check-all="_del">
                <i class="icon-list"></i>
                {lang.CHECK_ALL}
            </button>

            <div class="flex flex-wrap gap-2">
                <button type="submit" name="submit_files" value="{lang.DEL_SELECTED}" class="k-btn k-btn-danger">
                    <i class="icon-trash-2"></i>
                    {lang.DEL_SELECTED}
                </button>
                <button type="submit" name="submit_all_files" value="{lang.DEL_ALL}" class="k-btn k-btn-danger">
                    <i class="icon-trash-2"></i>
                    {lang.DEL_ALL}
                </button>
            </div>
        </div>

        {H_FORM_KEYS}

        </form>

        <!-- public link to this folder -->
        <div class="k-card k-spot mt-4 p-5" data-spotlight>
            <p class="k-label"><i class="icon-link"></i>{lang.COPY_AND_GET_DUD}</p>
            <div class="flex gap-2">
                <input class="k-input k-input-ltr" id="k-folder-link" readonly="readonly"
                       onclick="this.select();" type="text" name="option" value="{your_fileuser}">
                <button type="button" class="k-iconbtn k-copy-btn shrink-0" data-copy="#k-folder-link" data-i18n-label="copy">
                    <i class="icon-copy"></i>
                    <i class="icon-check"></i>
                </button>
            </div>
        </div>

    </IF>

</IF>
