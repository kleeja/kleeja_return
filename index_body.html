<!-- Powered by kleeja -->

<!-- ================================ hero ================================ -->
<section class="k-reveal k-reveal-1 mb-8 text-center">
    <span class="k-eyebrow mb-4">
        <i class="icon-sparkles"></i>
        {lang.WELCOME}<IF NAME="user_is"> &middot; {username}</IF>
    </span>

    <h1 class="k-title text-3xl sm:text-4xl lg:text-5xl">
        <span class="k-gradient-text">{config.sitename}</span>
    </h1>

    <IF NAME="welcome_msg">
        <div class="k-prose mx-auto mt-4 max-w-2xl text-base">{welcome_msg}</div>
    </IF>
</section>

<!-- ========================= info / error notices ======================== -->
<IF NAME="info">
    <div class="k-reveal k-reveal-2 mx-auto mb-6 grid max-w-3xl gap-3">
        <LOOP NAME="info">
            <IF LOOP="message_type == info">
                <!-- successful uploads arrive here carrying the up_boxes markup -->
                <div class="k-card k-upresult p-4 sm:p-5">{{message_content}}</div>
            <ELSE>
                <div class="k-alert k-alert-danger">
                    <span><strong>{lang.INFORMATION}:</strong> {{message_content}}</span>
                </div>
            </IF>
        </LOOP>
    </div>
</IF>

<!-- ============================= upload form ============================= -->
<form id="uploader" action="{action}" method="post" enctype="multipart/form-data"
      class="k-reveal k-reveal-3 mx-auto w-full max-w-3xl">

    <div class="k-card k-spot overflow-hidden p-5 sm:p-7" data-spotlight>

        <!-- drop zone -->
        <label for="file1" class="k-drop" id="k-drop">
            <span class="k-drop-glow" aria-hidden="true"></span>

            <span class="k-drop-icon">
                <i class="icon-cloud-upload"></i>
            </span>

            <span class="mt-4 block text-lg font-bold text-fg">{lang.DOWNLOAD_F}</span>
            <span class="mt-1 block text-sm text-muted" data-i18n="dropHint">Drag &amp; drop your files here</span>

            <span class="k-btn k-btn-outline pointer-events-none mt-5">
                <i class="icon-folder"></i>
                {lang.OPEN}
            </span>

            <!-- real inputs: hidden from view, driven by the zone above -->
            <LOOP NAME=FILES_NUM_LOOP>
                <input type="file" name="file_{{i}}_" id="file{{i}}" data-number="{{i}}" class="k-file-input">
            </LOOP>
        </label>

        <noscript>
            <IGNORE>
            <style>
                .k-file-input {
                    position: static;
                    display: block;
                    width: 100%;
                    height: auto;
                    margin: 0.4rem 0 0;
                    opacity: 1;
                    clip-path: none;
                }
                #k-drop {
                    cursor: default;
                }
            </style>
            </IGNORE>
        </noscript>

        <!-- selected files -->
        <ul id="k-file-list" class="mt-4 grid gap-2" hidden></ul>

        <!-- verification code -->
        <IF NAME="config.safe_code">
            <div class="k-solid mt-5 p-4">
                <p class="k-label"><i class="icon-shield"></i>{lang.VERTY_CODE}</p>
                <div class="flex flex-wrap items-center gap-3">
                    <img id="kleeja_img_captcha"
                         src="{captcha_file_path}"
                         data-captcha-src="{captcha_file_path}"
                         data-captcha-input="kleeja_code_answer"
                         alt="{lang.REFRESH_CAPTCHA}"
                         title="{lang.REFRESH_CAPTCHA}"
                         class="k-captcha-img">
                    <input type="text" name="kleeja_code_answer" id="kleeja_code_answer"
                           autocomplete="off" class="k-input k-input-ltr max-w-56 flex-1">
                </div>
                <p class="mt-2 text-xs text-faint">{lang.NOTE_CODE}</p>
            </div>
        </IF>

        <!-- terms + submit -->
        <div class="mt-6 flex flex-col items-center gap-4">
            <IF NAME="terms_msg">
                <div class="k-prose text-center text-xs text-muted">{terms_msg}</div>
            </IF>

            <button type="submit" id="submitr" name="submitr" value="{lang.DOWNLOAD_F}"
                    class="k-btn k-btn-primary k-btn-lg k-btn-block sm:w-auto sm:min-w-64">
                <i class="icon-upload"></i>
                {lang.DOWNLOAD_F}
            </button>
        </div>
    </div>
</form>

<!-- ============================ uploading state =========================== -->
<div id="loadbox" class="k-card mx-auto mt-6 w-full max-w-3xl p-8 text-center" hidden>
    <span class="k-drop-icon k-drop-icon-busy mx-auto">
        <i class="icon-loader k-spin"></i>
    </span>
    <p class="mt-4 text-base font-bold text-fg">{lang.WAIT_LOADING}</p>
    <div class="k-progressbar mt-5" role="progressbar" aria-label="{lang.WAIT_LOADING}"><span></span></div>
</div>

<!-- ============================= who is online =========================== -->
<IF NAME="show_online">
    <section class="k-reveal k-reveal-4 mx-auto mt-8 w-full max-w-3xl">
        <div class="k-card k-card-lift overflow-hidden">
            <div class="flex items-center gap-2.5 border-b px-5 py-3.5" style="border-color: var(--k-line);">
                <span class="k-online-dot" aria-hidden="true"></span>
                <span class="text-sm font-semibold text-fg-soft">{lang.NUMBER_ONLINE}</span>
                <span class="k-chip k-chip-brand ms-auto">{current_online_users}</span>
            </div>

            <IF NAME="show_names">
                <div class="flex flex-wrap gap-2 p-5">
                    <LOOP NAME="show_names">
                        <span class="k-chip"><i class="icon-user opacity-60"></i>{{name}}</span>
                    </LOOP>
                </div>
            </IF>
        </div>
    </section>
</IF>

<IF NAME="js_allowed_extensions_types">
<script>
    var KLEEJA_ALLOWED_EXTS  = {js_allowed_extensions_types};
    var KLEEJA_ALLOWED_SIZES = {js_allowed_extensions_sizes};
</script>
</IF>
