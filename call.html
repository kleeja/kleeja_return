<div class="mx-auto w-full max-w-2xl">

    <header class="k-reveal k-reveal-1 mb-6">
        <span class="k-eyebrow mb-3"><i class="icon-mail"></i>{lang.CALL}</span>
        <h1 class="k-title">{title}</h1>
    </header>

    <IF NAME="ERRORS">
        <div class="k-reveal k-reveal-2 k-alert k-alert-danger mb-4">
            <ul class="m-0 grid list-none gap-1 p-0">
                <LOOP NAME="ERRORS">
                    <li>{%value%}</li>
                </LOOP>
            </ul>
        </div>
    </IF>

    <form action="{action}" method="post" class="k-reveal k-reveal-3 k-card k-spot p-6 sm:p-7" data-spotlight>

        <IF NAME="NOT_USER">
            <div class="grid gap-x-4 sm:grid-cols-2">
                <label class="k-field" for="cname">
                    <span class="k-label"><i class="icon-user"></i>{lang.YOURNAME}</span>
                    <input type="text" class="k-input" id="cname" name="cname" value="{t_cname}" autocomplete="name">
                </label>

                <label class="k-field" for="cmail">
                    <span class="k-label"><i class="icon-at-sign"></i>{lang.EMAIL}</span>
                    <input type="email" class="k-input k-input-ltr" id="cmail" name="cmail" value="{t_cmail}" autocomplete="email">
                </label>
            </div>
        </IF>

        <label class="k-field" for="ctext">
            <span class="k-label"><i class="icon-message-square"></i>{lang.TEXT}</span>
            <textarea class="k-input" id="ctext" name="ctext" rows="6">{t_ctext}</textarea>
        </label>

        <!-- verification code -->
        <IF NAME="config.enable_captcha==1">
            <div class="k-solid mb-4 p-4">
                <p class="k-label"><i class="icon-shield"></i>{lang.VERTY_CODE}</p>
                <div class="flex flex-wrap items-center gap-3">
                    <img id="kleeja_img_captcha" src="{captcha_file_path}"
                         data-captcha-src="{captcha_file_path}" data-captcha-input="kleeja_code_answer"
                         alt="{lang.REFRESH_CAPTCHA}" title="{lang.REFRESH_CAPTCHA}" class="k-captcha-img">
                    <input type="text" name="kleeja_code_answer" id="kleeja_code_answer"
                           autocomplete="off" class="k-input k-input-ltr max-w-56 flex-1">
                </div>
                <p class="mt-2 text-xs text-faint">{lang.NOTE_CODE}</p>
            </div>
        </IF>

        {H_FORM_KEYS}

        <button type="submit" name="submit" value="{lang.SEND}" class="k-btn k-btn-primary">
            <i class="icon-send"></i>
            {lang.SEND}
        </button>
    </form>
</div>
