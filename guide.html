<header class="k-reveal k-reveal-1 mb-6">
    <span class="k-eyebrow mb-3"><i class="icon-book-open"></i>{lang.GUIDE}</span>
    <h1 class="k-title">{title}</h1>
    <p class="k-subtitle">{lang.GUIDE_EXP}</p>
</header>

<div class="grid items-start gap-4 md:grid-cols-2 xl:grid-cols-3">

    <LOOP NAME="ttgroups">

        <IF LOOP="firstrow">

            <UNLESS LOOP="most_firstrow">
                        </ul>
                    </div>
            </UNLESS>

            <div class="k-card k-card-lift k-spot overflow-hidden" data-reveal data-spotlight>
                <header class="flex items-center gap-2.5 border-b px-5 py-4" style="border-color: var(--k-line);">
                    <span class="k-stat-icon k-stat-icon-sm"><i class="icon-folder"></i></span>
                    <h2 class="text-sm font-bold text-fg">{{group_name}}</h2>
                </header>
                <ul class="max-h-96 overflow-y-auto">
        </IF>

                    <li class="k-listrow">
                        <span class="k-listrow-key">
                            <i class="icon-file-text text-brand opacity-70"></i>
                            <span class="font-mono text-xs tracking-wide uppercase">{{ext}}</span>
                        </span>
                        <span class="k-listrow-val text-xs">{{size}}</span>
                    </li>
    </LOOP>

    <IF NAME="ttgroups">
                </ul>
            </div>
    </IF>
</div>
