        <IF NAME="extras.footer">
            <div class="k-card k-prose mt-8 p-5">{extras.footer}</div>
        </IF>
    </main>

    <!-- ============================ footer ============================ -->
    <footer class="mt-auto">
        <div class="k-footer-bar">
            <div class="mx-auto w-full max-w-7xl px-4 py-7 sm:px-6 lg:px-8">

                <div class="flex flex-col items-center gap-5 text-center sm:flex-row sm:justify-between sm:text-start">

                    <!-- brand + copyright -->
                    <div class="flex items-center gap-3">
                        <span class="k-brand-mark">
                            <img src="{STYLE_PATH}images/logo.png" alt="" class="k-logo k-logo-light">
                            <img src="{STYLE_PATH}images/logo-light.png" alt="" class="k-logo k-logo-dark">
                        </span>
                        <div class="text-sm">
                            <a href="{config.siteurl}" class="block font-bold text-fg no-underline transition-colors hover:text-brand">{config.sitename}</a>
                            <span class="text-xs text-faint">{lang.COPYRIGHTS_X} &copy; {config.sitename}</span>
                        </div>
                    </div>

                    <!-- quick links -->
                    <nav class="flex flex-wrap items-center justify-center gap-x-5 gap-y-2 text-sm">
                        <LOOP NAME="top_menu">
                            <IF LOOP="show">
                                <a href="{{url}}" class="k-footer-link">{{title}}</a>
                            </IF>
                        </LOOP>
                    </nav>
                </div>

                <hr class="k-divider my-6">

                <div class="flex flex-col-reverse items-center gap-3 text-xs sm:flex-row sm:justify-between">

                    <div class="flex flex-wrap items-center justify-center gap-3">
                        <!-- Powered by kleeja.net -->
                        <a href="https://kleeja.net/" target="_blank" rel="noopener" title="Kleeja" class="k-chip transition-colors hover:text-brand">
                            <i class="icon-zap"></i>
                            Powered by Kleeja
                        </a>

                        <IF NAME="page_stats">
                            <span class="k-stats-line">{page_stats}</span>
                        </IF>
                    </div>

                    <IF NAME="admin_page">
                        <span class="k-chip k-chip-brand k-admin-link">{admin_page}</span>
                    </IF>
                </div>
            </div>
        </div>
    </footer>

    <!-- toast host -->
    <div class="k-toaster" id="k-toaster" role="status" aria-live="polite"></div>

    {googleanalytics}

    <!-- don't ever delete this -->
    {run_queue}

    <script src="{STYLE_PATH}js/kleeja.js"></script>
</body>
</html>
