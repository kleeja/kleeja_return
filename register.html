<div class="mx-auto w-full max-w-md">

    <header class="k-reveal k-reveal-1 mb-6 text-center">
        <span class="k-auth-icon"><i class="icon-user-plus"></i></span>
        <h1 class="k-title mt-4">{title}</h1>
        <p class="k-subtitle">{lang.REGISTER}</p>
    </header>

    <IF NAME="ERRORS">
        <div class="k-reveal k-reveal-2 k-alert k-alert-danger mb-4">
            <ul class="m-0 grid list-none gap-1 p-0">
                <LOOP NAME="ERRORS">
                    <li>{%value%}</li>
                </LOOP>
            </ul>
        </div>
    </IF>

    <form action="{action}" method="post" class="k-reveal k-reveal-3 k-card k-spot p-6 sm:p-7" data-spotlight>

        <label class="k-field" for="lname">
            <span class="k-label"><i class="icon-user"></i>{lang.USERNAME}</span>
            <input type="text" class="k-input" id="lname" name="lname" value="{t_lname}" autocomplete="username" autofocus>
        </label>

        <label class="k-field" for="lpass">
            <span class="k-label"><i class="icon-lock"></i>{lang.PASSWORD}</span>
            <span class="k-password">
                <input type="password" class="k-input pe-11" id="lpass" name="lpass" value="{t_lpass}" autocomplete="new-password">
                <button type="button" class="k-password-toggle" data-toggle-password="lpass" tabindex="-1">
                    <i class="icon-eye"></i>
                    <i class="icon-eye-off"></i>
                </button>
            </span>
        </label>

        <label class="k-field" for="lpass2">
            <span class="k-label"><i class="icon-key"></i>{lang.REPEAT_PASS}</span>
            <input type="password" class="k-input" id="lpass2" name="lpass2" value="{t_lpass2}" autocomplete="new-password">
        </label>

        <label class="k-field" for="lmail">
            <span class="k-label"><i class="icon-at-sign"></i>{lang.EMAIL}</span>
            <input type="email" class="k-input k-input-ltr" id="lmail" name="lmail" value="{t_lmail}" autocomplete="email">
        </label>

        <!-- verification code -->
        <IF NAME="config.enable_captcha==1">
            <div class="k-solid mb-4 p-4">
                <p class="k-label"><i class="icon-shield"></i>{lang.VERTY_CODE}</p>
                <div class="flex flex-wrap items-center gap-3">
                    <img id="kleeja_img_captcha" src="{captcha_file_path}"
                         data-captcha-src="{captcha_file_path}" data-captcha-input="kleeja_code_answer"
                         alt="{lang.REFRESH_CAPTCHA}" title="{lang.REFRESH_CAPTCHA}" class="k-captcha-img">
                    <input type="text" name="kleeja_code_answer" id="kleeja_code_answer"
                           autocomplete="off" class="k-input k-input-ltr max-w-56 flex-1">
                </div>
                <p class="mt-2 text-xs text-faint">{lang.NOTE_CODE}</p>
            </div>
        </IF>

        {H_FORM_KEYS}

        <button type="submit" name="submit" value="{lang.REGISTER}" class="k-btn k-btn-primary k-btn-block">
            <i class="icon-user-plus"></i>
            {lang.REGISTER}
        </button>
    </form>
</div>
