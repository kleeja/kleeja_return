<!-- Kleeja Return — upload result blocks.
     Careful: get_up_tpl_box() strips newlines and the whitespace after them,
     so never split an element's attributes across two lines in this file. -->

<!-- BEGIN image_thumb -->
<div class="k-upbox" data-copy-scope>
<a href="{b_url_link}" target="_blank" class="k-upbox-preview">
<img src="{b_img_link}" alt="{b_title}" loading="lazy">
<span class="k-upbox-preview-zoom"><i class="icon-external-link"></i></span>
</a>
<div class="k-upbox-head">
<span class="k-upbox-label"><i class="icon-image"></i>{b_title}</span>
<button type="button" class="k-upbox-copy k-copy-btn" data-copy="" data-i18n-label="copy"><i class="icon-copy"></i><i class="icon-check"></i></button>
</div>
<textarea class="k-upbox-input" data-copy-source readonly="readonly" rows="2" onclick="this.select();">[url={b_url_link}][img]{b_img_link}[/img][/url]</textarea>
</div>
<!-- END image_thumb -->

<!-- BEGIN image -->
<div class="k-upbox" data-copy-scope>
<div class="k-upbox-head">
<span class="k-upbox-label"><i class="icon-link"></i>{b_title}</span>
<button type="button" class="k-upbox-copy k-copy-btn" data-copy="" data-i18n-label="copy"><i class="icon-copy"></i><i class="icon-check"></i></button>
</div>
<textarea class="k-upbox-input" data-copy-source readonly="readonly" rows="2" onclick="this.select();">{b_url_link}</textarea>
</div>
<div class="k-upbox" data-copy-scope>
<div class="k-upbox-head">
<span class="k-upbox-label"><i class="icon-message-square"></i>{b_bbc_title}</span>
<button type="button" class="k-upbox-copy k-copy-btn" data-copy="" data-i18n-label="copy"><i class="icon-copy"></i><i class="icon-check"></i></button>
</div>
<textarea class="k-upbox-input" data-copy-source readonly="readonly" rows="2" onclick="this.select();">[url={siteurl}][img]{b_url_link}[/img][/url]</textarea>
</div>
<div class="k-upbox" data-copy-scope>
<div class="k-upbox-head">
<span class="k-upbox-label"><i class="icon-file-text"></i>HTML</span>
<button type="button" class="k-upbox-copy k-copy-btn" data-copy="" data-i18n-label="copy"><i class="icon-copy"></i><i class="icon-check"></i></button>
</div>
<textarea class="k-upbox-input" data-copy-source readonly="readonly" rows="3" onclick="this.select();">&lt;a href=&quot;{siteurl}&quot; target=&quot;_blank&quot; title=&quot;{sitename}&quot;&gt;&lt;img src=&quot;{b_url_link}&quot; border=&quot;0&quot; alt=&quot;{b_url_link}&quot; /&gt;&lt;/a&gt;</textarea>
</div>
<!-- END image -->

<!-- BEGIN file -->
<div class="k-upbox" data-copy-scope>
<div class="k-upbox-head">
<span class="k-upbox-label"><i class="icon-link"></i>{b_title}</span>
<button type="button" class="k-upbox-copy k-copy-btn" data-copy="" data-i18n-label="copy"><i class="icon-copy"></i><i class="icon-check"></i></button>
</div>
<textarea class="k-upbox-input" data-copy-source readonly="readonly" rows="2" onclick="this.select();">{b_url_link}</textarea>
</div>
<div class="k-upbox" data-copy-scope>
<div class="k-upbox-head">
<span class="k-upbox-label"><i class="icon-message-square"></i>{b_bbc_title}</span>
<button type="button" class="k-upbox-copy k-copy-btn" data-copy="" data-i18n-label="copy"><i class="icon-copy"></i><i class="icon-check"></i></button>
</div>
<textarea class="k-upbox-input" data-copy-source readonly="readonly" rows="2" onclick="this.select();">[url={b_url_link}]{b_url_link}[/url]</textarea>
</div>
<!-- END file -->

<!-- BEGIN del_file_code -->
<div class="k-upbox k-upbox-danger" data-copy-scope>
<div class="k-upbox-head">
<span class="k-upbox-label"><i class="icon-trash-2"></i>{b_title}</span>
<button type="button" class="k-upbox-copy k-copy-btn" data-copy="" data-i18n-label="copy"><i class="icon-copy"></i><i class="icon-check"></i></button>
</div>
<textarea class="k-upbox-input" data-copy-source readonly="readonly" rows="2" onclick="this.select();">{b_code_link}</textarea>
</div>
<!-- END del_file_code -->
