<header class="k-reveal k-reveal-1 mb-6">
    <span class="k-eyebrow mb-3"><i class="icon-chart-column"></i>{lang.STATS}</span>
    <h1 class="k-title">{title}</h1>
    <p class="k-subtitle">{lang.LAST_1_H}</p>
</header>

<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">

    <div class="k-card k-card-lift k-spot p-5" data-reveal data-spotlight>
        <span class="k-stat-icon"><i class="icon-file-text"></i></span>
        <p class="k-stat-label">{lang.FILES_ST}</p>
        <p class="k-stat-value">{files_st}</p>
        <p class="k-stat-note">{lang.FILE} &middot; {imgs_st} {lang.IMAGE}</p>
    </div>

    <div class="k-card k-card-lift k-spot p-5" data-reveal data-spotlight>
        <span class="k-stat-icon"><i class="icon-hard-drive"></i></span>
        <p class="k-stat-label">{lang.SIZES_ST}</p>
        <p class="k-stat-value">{sizes_st}</p>
    </div>

    <IF NAME="config.user_system==1">
        <div class="k-card k-card-lift k-spot p-5" data-reveal data-spotlight>
            <span class="k-stat-icon"><i class="icon-users"></i></span>
            <p class="k-stat-label">{lang.USERS_ST}</p>
            <p class="k-stat-value">{users_st}</p>
            <p class="k-stat-note">{lang.USER}</p>
        </div>

        <div class="k-card k-card-lift k-spot p-5" data-reveal data-spotlight>
            <span class="k-stat-icon"><i class="icon-user-plus"></i></span>
            <p class="k-stat-label">{lang.LAST_REG}</p>
            <p class="k-stat-value k-stat-value-sm">{lst_reg}</p>
        </div>
    </IF>

    <IF NAME="lst_dl_st">
        <div class="k-card k-card-lift k-spot p-5" data-reveal data-spotlight>
            <span class="k-stat-icon"><i class="icon-clock"></i></span>
            <p class="k-stat-label">{lang.LSTDELST}</p>
            <p class="k-stat-value k-stat-value-sm">{lst_dl_st}</p>
        </div>
    </IF>

    <IF NAME="config.allow_online==1">
        <div class="k-card k-card-lift k-spot p-5" data-reveal data-spotlight>
            <span class="k-stat-icon"><i class="icon-activity"></i></span>
            <p class="k-stat-label">{lang.MOST_EVER_ONLINE}</p>
            <p class="k-stat-value">{most_online}</p>
            <p class="k-stat-note">{lang.ON} {on_muoe}</p>
        </div>
    </IF>
</div>
